DotnetPluginId=SkeleKit.Rider.Backend
DotnetSolution=SkeleKit.Rider.Backend.sln
RiderPluginId=com.skelekit.rider
PluginVersion=0.1.0

BuildConfiguration=Debug

# Rider to build/run against. Keep in sync with the installed Rider (261.x = 2026.1.x).
ProductVersion=2026.1.4

# Kotlin bundles its own stdlib in the IDE; don't add ours.
kotlin.stdlib.default.dependency=false

# Resolve Rider artifacts from Maven, not the binary CDN releases.
org.jetbrains.intellij.platform.buildFeature.useBinaryReleases=false
